services:
  server:
    build:
      context: .

    ports:
      - "50000:50000"

    environment:
      SERVER_PORT: "50000"
      SPRING_DATASOURCE_URL: "jdbc:mysql://db:3306/ajf?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC"
      SPRING_DATASOURCE_USERNAME: "root"
      SPRING_DATASOURCE_PASSWORD: "1234"

      AWS_S3_BUCKET_NAME: "music-practice-s3-sheetmusic-035839415283-ca-central-1"
      AWS_REGION: "ca-central-1"
      AWS_SHARED_CREDENTIALS_FILE: "/aws/credentials"
      AWS_CONFIG_FILE: "/aws/config"

    volumes:
      - "${USERPROFILE}/.aws:/aws:ro"

    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.0
    restart: always

    environment:
      MYSQL_ROOT_PASSWORD: "1234"
      MYSQL_DATABASE: "ajf"

    ports:
      - "3307:3306"

    volumes:
      - db-data:/var/lib/mysql

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD"
        ]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  db-data: