<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1a1612">
<title>Practice Dashboard</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/pages.css">
</head>
<body>
	<div id="studio-shell"></div>
	<main class="main-container">
		<div class="page-heading">
			<div>
				<h2>Practice Dashboard</h2>
				<p>View your piano library, practice activity, and learning goals.</p>
			</div>
			<div class="page-heading-actions">
				<a class="main-button" href="practice.html">Start Practice</a>
				<a class="main-button" href="goals.html">Learning Goals</a>
			</div>
		</div>
		<div class="dashboard-grid stagger-in">
			<div class="dashboard-card">
				<div class="card-icon" aria-hidden="true">
					<svg width="18" height="18" viewBox="0 0 24 24" fill="none"><rect x="4" y="5" width="16" height="14" rx="2" stroke="currentColor" stroke-width="2"/><path d="M8 9h8M8 13h5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
				</div>
				<h3>Total Piano Pieces</h3>
				<p class="stat-value" data-count="3">3</p>
			</div>
			<div class="dashboard-card">
				<div class="card-icon" aria-hidden="true">
					<svg width="18" height="18" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="8" stroke="currentColor" stroke-width="2"/><path d="M12 8v5l3 2" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
				</div>
				<h3>Practice Sessions</h3>
				<p class="stat-value" data-count="8">8</p>
			</div>
			<div class="dashboard-card">
				<div class="card-icon" aria-hidden="true">
					<svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M4 17V7m6 10V4m6 13v-8m6 8H2" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
				</div>
				<h3>Total Practice Time</h3>
				<p>
					<span class="stat-value" data-count="214">214</span>
					<span class="stat-unit">minutes</span>
				</p>
			</div>
			<div class="dashboard-card">
				<div class="card-icon" aria-hidden="true">
					<svg width="18" height="18" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="8" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="12" r="3" fill="currentColor"/></svg>
				</div>
				<h3>Active Goals</h3>
				<p class="stat-value" data-count="1">1</p>
			</div>
			<div class="dashboard-card">
				<div class="card-icon" aria-hidden="true">
					<svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M5 12.5l4.5 4.5L19 7" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
				</div>
				<h3>Completed Goals</h3>
				<p class="stat-value" data-count="2">2</p>
			</div>
			<div class="dashboard-card featured-stat">
				<div class="card-icon" aria-hidden="true">
					<svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M8 18V8l10-2v10" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="6.5" cy="18" r="2.5" fill="currentColor"/><circle cx="16.5" cy="16" r="2.5" fill="currentColor"/></svg>
				</div>
				<h3>Most Practised Piece</h3>
				<p class="featured-copy">Clair de Lune</p>
			</div>
		</div>
	</main>
	<a class="demo-chip" href="readme.html">GitHub Pages preview</a>
	<script src="js/partials.js"></script>
	<script>StudioPartials.mount("dashboard");</script>
	<script src="js/app.js" defer></script>
	<script src="js/demo.js" defer></script>
</body>
</html>
