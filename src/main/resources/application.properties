spring.application.name=Music_Practice_Management_System

spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update

server.port=${SERVER_PORT:50000}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/ajf}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:1234}

spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

aws.s3.bucket-name=${AWS_S3_BUCKET_NAME:music-practice-s3-sheetmusic-035839415283-ca-central-1}
aws.region=${AWS_REGION:ca-central-1}

server.servlet.session.persistent=false