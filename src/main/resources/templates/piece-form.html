<!DOCTYPE html>
<html xmlns:th="www.thymeleaf.org" lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1a1612">
<title>Modify Piano Pieces</title>
<link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

	<div th:replace="~{fragments :: backdrop}"></div>
	<header th:replace="~{fragments :: appHeader(active='pieces', email=${email})}"></header>

	<main class="form-container">

		<div class="page-heading">
			<div>
				<h2
					th:text="${pianoPiece.id == null
						? 'Add Piano Piece'
						: 'Edit Piano Piece'}">
					Add Piano Piece</h2>
				<p>Give the piece a home in your studio — title, composer, and how it currently feels under your hands.</p>
			</div>
		</div>

		<form method="post"
			enctype="multipart/form-data"
			th:action="${pianoPiece.id == null}
				? @{/pieces/save}
				: @{/pieces/update/{id}(id=${pianoPiece.id})}"
			th:object="${pianoPiece}">

			<input type="hidden" th:field="*{id}">

			<div class="field-group">
				<label for="title">Title:</label>
				<input type="text" id="title" th:field="*{title}"
					placeholder="Enter the piano piece title" required>
			</div>

			<div class="field-group">
				<label for="composerName">Composer:</label>
				<input type="text" id="composerName" name="composerName"
					th:value="${pianoPiece.composer != null ? pianoPiece.composer.name : ''}"
					placeholder="Enter composer name" required>
			</div>

			<div class="field-group">
				<label for="genre">Genre:</label>
				<select id="genre" th:field="*{genre}" required>
					<option value="">Select a genre</option>
					<option th:each="genre : ${genres}" th:value="${genre}"
						th:text="${genre.displayName}"></option>
				</select>
			</div>

			<div class="field-group">
				<label for="difficulty">Difficulty:</label>
				<select id="difficulty" th:field="*{difficulty}" required>
					<option value="">Select difficulty</option>
					<option value="Beginner">Beginner</option>
					<option value="Intermediate">Intermediate</option>
					<option value="Advanced">Advanced</option>
				</select>
			</div>

			<div class="field-group">
				<label for="learningStatus">Learning Status:</label>
				<select id="learningStatus" th:field="*{learningStatus}" required>
					<option value="">Select learning status</option>
					<option th:each="status : ${statuses}" th:value="${status}"
						th:text="${status.displayName}"></option>
				</select>
			</div>

			<div class="field-group">
				<label for="rating">Rating:</label>
				<select id="rating" th:field="*{rating}" required>
					<option value="">Select a rating</option>
					<option value="1">1 / 5</option>
					<option value="2">2 / 5</option>
					<option value="3">3 / 5</option>
					<option value="4">4 / 5</option>
					<option value="5">5 / 5</option>
				</select>
			</div>

			<div class="field-group">
				<label for="sheetMusicFile">Sheet Music PDF:</label>
				<div class="file-drop" data-file-drop tabindex="0" role="button"
					aria-label="Upload sheet music PDF">
					<input type="file"
						id="sheetMusicFile"
						name="sheetMusicFile"
						accept="application/pdf">
					<span class="file-drop-title">Drop a PDF here, or click to browse</span>
					<p class="file-drop-hint" data-file-name>PDF up to 20MB</p>
				</div>
				<p class="current-file" th:if="${pianoPiece.sheetMusicFileName != null}">
					Current PDF:
					<span th:text="${pianoPiece.sheetMusicFileName}">
						sheet-music.pdf
					</span>
				</p>
			</div>

			<div class="form-buttons">

				<input type="submit"
					th:value="${pianoPiece.id == null}
						? 'Add Piano Piece'
						: 'Save Changes'">

				<a th:href="@{/pieces}" class="cancel-button"> Cancel </a>

			</div>

		</form>

	</main>

	<script th:replace="~{fragments :: scripts}"></script>

</body>
</html>
